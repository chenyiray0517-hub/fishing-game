<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>釣魚遊戲</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="rotatePrompt">
    <div class="icon">📱</div>
    <div>請將裝置橫置</div>
    <div style="font-size:14px;color:#445566">遊戲需要橫向模式</div>
  </div>
  <canvas id="gameCanvas"></canvas>
  <script>
    // roundRect polyfill for older browsers
    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        this.moveTo(x + r, y);
        this.arcTo(x + w, y, x + w, y + h, r);
        this.arcTo(x + w, y + h, x, y + h, r);
        this.arcTo(x, y + h, x, y, r);
        this.arcTo(x, y, x + w, y, r);
        this.closePath();
      };
    }
  </script>
  <script src="js/config.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/player.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/fishing.js"></script>
  <script src="js/backpack.js"></script>
  <script src="js/dialogue.js"></script>
  <script src="js/quest.js"></script>
  <script src="js/gamemap.js"></script>
  <script src="js/harbor.js"></script>
  <script src="js/ocean.js"></script>
  <script src="js/ocean2.js"></script>
  <script src="js/lake.js"></script>
  <script src="js/beach.js"></script>
  <script src="js/pond.js"></script>
  <script src="js/encyclopedia.js"></script>
  <script src="js/touch.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
